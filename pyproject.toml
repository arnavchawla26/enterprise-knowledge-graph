[project]
name = "ekg"
version = "0.1.0"
description = "Enterprise Knowledge Graph: ontology, entity resolution, lineage, graph data science, text-to-Cypher and a data-trust dashboard over the services-ops-intelligence enterprise (Dell project 2 of 3)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Arnav Chawla" }]
requires-python = ">=3.13"
dependencies = [
    "anthropic==1.15.0",
    "duckdb==1.5.6",
    "elasticsearch==8.17.2",
    "fastapi==0.143.3",
    "httpx==0.28.1",
    "lightgbm==4.7.0",
    "neo4j==6.4.1",
    "numpy==2.5.4",
    "openai==3.33.0",
    "pandas==3.0.6",
    "psycopg[binary]==3.3.6",
    "pyarrow==26.0.0",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "rdflib==7.6.0",
    "scikit-learn==1.9.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "playwright==1.64.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ekg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
